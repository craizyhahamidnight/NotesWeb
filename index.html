<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1e222b;
    --card3: #232833;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6c8cff;
    --green: #3ecf8e;
    --amber: #f5a524;
    --red: #f2545b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", sans-serif;
    font-size: 14px;
    padding: 22px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---------- header ---------- */
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .hdr h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub b { color: var(--text); font-weight: 600; }
  .letter-pill {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 2px 9px; font-weight: 700; font-size: 13px; margin-left: 6px;
  }

  /* ---------- buttons / inputs ---------- */
  input, button, select { font: inherit; }
  input[type=text], input:not([type]), input[type=datetime-local],
  input[type=date], input[type=number] {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s;
    color-scheme: dark;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #5c6377; }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: .15s;
  }
  button:hover { background: var(--card3); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }

  /* ---------- settings ---------- */
  .settings {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 18px;
  }
  .settings.hidden { display: none; }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; line-height: 1.6; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 12px; }
  .row label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .row label input { color: var(--text); }

  /* ---------- week strip ---------- */
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (max-width: 620px) { .week { grid-template-columns: repeat(2, 1fr); } }
  .day {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 10px; min-height: 106px; display: flex; flex-direction: column; gap: 4px;
    transition: .2s;
  }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: #1a1f2e; }
  .day-name { font-size: 12px; color: var(--muted); }
  .day-date { font-size: 11px; color: #5c6377; }
  .day-letter {
    align-self: flex-start; margin-top: 2px;
    background: var(--card3); color: var(--text); font-weight: 700; font-size: 15px;
    border-radius: 8px; padding: 2px 10px; letter-spacing: .5px;
  }
  .day.today .day-letter { background: var(--accent); color: #fff; }
  .day-tasks { margin-top: auto; display: flex; flex-direction: column; gap: 3px; }
  .mini {
    font-size: 11px; color: #b9c0d0; background: #1f242f; border-radius: 6px;
    padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini.urgent { color: #ffb3b6; background: #2c1c20; }

  /* ---------- form ---------- */
  .form-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 18px;
  }
  #fTitle { flex: 1 1 260px; }
  #fSubject { flex: 0 1 140px; }
  #fNormal, #fCram { width: 112px; }

  /* ---------- stats ---------- */
  .stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 14px; padding: 0 4px; }
  .stats b { color: var(--text); font-weight: 600; }

  /* ---------- task list ---------- */
  .tasks { display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }

  .task {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; transition: .2s;
  }
  .task.overdue { border-color: #4a2429; }
  .task.done { opacity: .45; }
  .task.done .task-title { text-decoration: line-through; }

  .task-top { display: flex; gap: 10px; align-items: flex-start; }
  .chk { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; font-size: 14.5px; line-height: 1.35; word-break: break-word; }
  .subject {
    display: inline-block; font-size: 11px; font-weight: 500; color: #9fb0d8;
    background: #1d2333; border: 1px solid #2b3448; border-radius: 6px;
    padding: 1px 7px; margin-left: 7px; vertical-align: 1px;
  }
  .task-due { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
  .cd { font-weight: 600; }
  .cd.ok { color: var(--green); }
  .cd.soon { color: var(--amber); }
  .cd.urgent { color: var(--red); }
  .cd.overdue { color: var(--red); }
  .warn { color: var(--red); font-size: 12px; margin-top: 5px; font-weight: 600; }

  .del {
    background: transparent; border: none; color: #4b5263; font-size: 16px;
    padding: 2px 6px; border-radius: 8px; line-height: 1;
  }
  .del:hover { background: #2a1d20; color: var(--red); }

  .bars { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { font-size: 11px; color: var(--muted); width: 46px; flex: none; letter-spacing: .3px; }
  .bar { flex: 1; height: 8px; background: var(--card3); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .35s ease; }
  .fill.normal { background: linear-gradient(90deg, #4d7cff, #6c8cff); }
  .fill.cram { background: linear-gradient(90deg, #f5a524, #f2545b); }
  .bar-val { font-size: 11.5px; color: var(--muted); width: 118px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .bar-val b { color: var(--text); font-weight: 600; }
  .bar-val.full b { color: var(--green); }

  .task-actions { display: flex; gap: 7px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .task-actions button { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
  .spent { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hdr">
    <div>
      <h1>📚 Planner</h1>
      <div class="sub" id="todayLine"></div>
    </div>
    <div>
      <button id="btnSettings">⚙︎ 设置</button>
    </div>
  </header>

  <div id="settingsPanel" class="settings hidden">
    <div class="row">
      <label>Cycle 长度 <input id="setLen" type="number" min="1" max="99" style="width:76px"></label>
      <label>这天是 A Day <input id="setAnchor" type="date"></label>
      <label><input id="setSkip" type="checkbox"> 周末不推进 cycle</label>
    </div>
    <p class="hint">
      例：6 天 cycle，9/1 设为 A Day → 9/1=A, 9/2=B, 9/3=C, 9/4=D, 9/5=E, 9/6=F, 9/7=A …<br>
      勾上「周末不推进」后，周六周日沿用周五的字母，cycle 只在上课日往前走。
    </p>
  </div>

  <section class="week" id="weekStrip"></section>

  <section class="form-card">
    <form id="taskForm">
      <div class="row">
        <input id="fTitle" type="text" placeholder="任务名称，例如：物理 Ch.5 习题" required>
        <input id="fSubject" type="text" placeholder="科目（可选）">
      </div>
      <div class="row">
        <label>Due <input id="fDue" type="datetime-local" required></label>
        <label>Normal <input id="fNormal" type="text" placeholder="90 / 1.5h / 1:30"></label>
        <label>Cram <input id="fCram" type="text" placeholder="45"></label>
        <button type="submit" class="primary">＋ 添加任务</button>
      </div>
      <p class="hint">
        <b>Normal</b> = 按正常节奏（不熬夜、认真做）预计要花的时间。
        <b>Cram</b> = 极限赶工、只求交差时估计能压到的时间。
        两边共用一个「已投入」计时。
      </p>
    </form>
  </section>

  <div class="stats" id="stats"></div>

  <section class="tasks" id="taskList"></section>

</div>

<script>
/* =========================================================
   工具函数
   ========================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');

function toISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function todayISO() { return toISO(new Date()); }
function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toLocalInput(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function getMonday(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  const day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  return x;
}
function fmtDur(mins) {
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h && m) return `${h}h${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}
function parseDuration(str) {
  if (str == null) return 0;
  let s = String(str).trim().toLowerCase();
  if (!s) return 0;
  if (/^\d+:\d+$/.test(s)) { const [a, b] = s.split(':').map(Number); return a * 60 + b; }
  if (s.endsWith('h')) { const n = parseFloat(s); return isNaN(n) ? 0 : Math.round(n * 60); }
  if (s.endsWith('m')) { const n = parseInt(s, 10); return isNaN(n) ? 0 : n; }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.round(n);
}
function fmtCountdown(dueMs) {
  const diff = dueMs - Date.now();
  if (diff <= 0) return { text: '已过期', level: 'overdue' };
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  let text;
  if (d > 0) text = `${d}天${h}小时`;
  else if (h > 0) text = `${h}小时${m}分`;
  else text = `${m}分钟`;
  const level = diff < 86400000 ? 'urgent' : diff < 3 * 86400000 ? 'soon' : 'ok';
  return { text: '还有 ' + text, level };
}
function fmtDue(dueStr) {
  const d = new Date(dueStr);
  if (isNaN(d)) return dueStr;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dd = new Date(d); dd.setHours(0, 0, 0, 0);
  const diffDays = Math.round((dd - today) / 86400000);
  let dayPart;
  if (diffDays === 0) dayPart = '今天';
  else if (diffDays === 1) dayPart = '明天';
  else if (diffDays === 2) dayPart = '后天';
  else dayPart = `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${dayPart} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* =========================================================
   状态
   ========================================================= */
const KEY = 'planner.v1';
const DEFAULT_SETTINGS = {
  cycleLength: 6,
  anchorDate: todayISO(),
  skipWeekend: false
};

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { settings: { ...DEFAULT_SETTINGS }, tasks: [] };
    const s = JSON.parse(raw);
    return {
      settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) },
      tasks: Array.isArray(s.tasks) ? s.tasks : []
    };
  } catch (e) {
    return { settings: { ...DEFAULT_SETTINGS }, tasks: [] };
  }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* =========================================================
   Letter cycle 计算
   ========================================================= */
function workdayDiff(a, b) {
  // 返回从 a 到 b 之间经过的「工作日」天数（b 晚于 a 为正）
  const start = new Date(a); start.setHours(0, 0, 0, 0);
  const end = new Date(b); end.setHours(0, 0, 0, 0);
  if (start.getTime() === end.getTime()) return 0;
  const guard = 4000;
  const step = start < end ? 1 : -1;
  let count = 0, n = 0;
  const cur = new Date(start);
  while (cur.getTime() !== end.getTime() && n++ < guard) {
    cur.setDate(cur.getDate() + step);
    const wd = cur.getDay();
    if (wd !== 0 && wd !== 6) count += step;
  }
  return count;
}

function letterIndexFor(iso) {
  const cfg = state.settings;
  const n = Math.max(1, Number(cfg.cycleLength) || 1);
  const a = parseISO(cfg.anchorDate);
  const b = parseISO(iso);
  let diff;
  if (cfg.skipWeekend) {
    diff = workdayDiff(a, b);
  } else {
    diff = Math.round((b - a) / 86400000);
  }
  return ((diff % n) + n) % n;
}

function letterLabel(iso) {
  const i = letterIndexFor(iso);
  return i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  renderHeader();
  renderWeek();
  renderStats();
  renderTasks();
}

function renderHeader() {
  const now = new Date();
  const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];
  const iso = todayISO();
  $('#todayLine').innerHTML =
    `今天 · ${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${wd}` +
    `<span class="letter-pill">${letterLabel(iso)} Day</span>`;
}

function renderWeek() {
  const strip = $('#weekStrip');
  const monday = getMonday(new Date());
  const names = ['周一', '周二', '周三', '周四', '周五'];
  const today = todayISO();
  let html = '';

  for (let i = 0; i < 5; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const iso = toISO(d);
    const isToday = iso === today;

    const dueToday = state.tasks
      .filter(t => !t.done && t.due && t.due.slice(0, 10) === iso)
      .sort((a, b) => new Date(a.due) - new Date(b.due));

    const minis = dueToday.slice(0, 3).map(t => {
      const msLeft = new Date(t.due).getTime() - Date.now();
      const cls = msLeft < 86400000 ? 'mini urgent' : 'mini';
      const title = (t.title || '').slice(0, 14);
      return `<span class="${cls}" title="${escapeHtml(t.title)}">• ${escapeHtml(title)}</span>`;
    }).join('');
    const more = dueToday.length > 3
      ? `<span class="mini">+${dueToday.length - 3} 更多</span>` : '';

    html += `
      <div class="day${isToday ? ' today' : ''}">
        <div class="day-name">${names[i]}</div>
        <div class="day-date">${d.getMonth() + 1}/${d.getDate()}</div>
        <div class="day-letter">${letterLabel(iso)}</div>
        <div class="day-tasks">${minis}${more}</div>
      </div>`;
  }
  strip.innerHTML = html;
}

function renderStats() {
  const active = state.tasks.filter(t => !t.done);
  const totalNormal = active.reduce((s, t) => s + Math.max(0, (t.normalMins || 0) - (t.spent || 0)), 0);
  const totalCram = active.reduce((s, t) => s + Math.max(0, (t.cramMins || 0) - (t.spent || 0)), 0);
  const overdue = active.filter(t => new Date(t.due).getTime() < Date.now()).length;

  $('#stats').innerHTML = `
    <span>未完成 <b>${active.length}</b> 项</span>
    <span>剩余 Normal <b>${fmtDur(totalNormal)}</b></span>
    <span>剩余 Cram <b>${fmtDur(totalCram)}</b></span>
    ${overdue ? `<span style="color:var(--red)">已过期 <b style="color:var(--red)">${overdue}</b> 项</span>` : ''}
  `;
}

function renderTasks() {
  const list = $('#taskList');
  const tasks = [...state.tasks].sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    return new Date(a.due) - new Date(b.due);
  });

  if (!tasks.length) {
    list.innerHTML = `<div class="empty">还没有任务，在上面的表单里加一个吧 ✨</div>`;
    return;
  }
  list.innerHTML = tasks.map(taskHTML).join('');
}

function taskHTML(t) {
  const dueMs = new Date(t.due).getTime();
  const cd = fmtCountdown(dueMs);
  const spent = t.spent || 0;
  const normalMins = t.normalMins || 0;
  const cramMins = t.cramMins || 0;

  const nLeft = Math.max(0, normalMins - spent);
  const cLeft = Math.max(0, cramMins - spent);
  const nPct = normalMins ? Math.min(100, (spent / normalMins) * 100) : 0;
  const cPct = cramMins ? Math.min(100, (spent / cramMins) * 100) : 0;

  const msLeft = Math.max(0, dueMs - Date.now());
  const minsLeft = msLeft / 60000;
  const notEnoughTime = !t.done && cramMins > 0 && cLeft > minsLeft;
  const overdue = dueMs < Date.now();

  const bars = (normalMins || cramMins) ? `
    <div class="bars">
      ${normalMins ? `
      <div class="bar-row">
        <span class="bar-label">Normal</span>
        <div class="bar"><div class="fill normal" style="width:${nPct}%"></div></div>
        <span class="bar-val${nLeft === 0 ? ' full' : ''}">
          ${nLeft === 0 ? '<b>已完成</b>' : `剩 <b>${fmtDur(nLeft)}</b>`} / ${fmtDur(normalMins)}
        </span>
      </div>` : ''}
      ${cramMins ? `
      <div class="bar-row">
        <span class="bar-label">Cram</span>
        <div class="bar"><div class="fill cram" style="width:${cPct}%"></div></div>
        <span class="bar-val${cLeft === 0 ? ' full' : ''}">
          ${cLeft === 0 ? '<b>已够交差</b>' : `剩 <b>${fmtDur(cLeft)}</b>`} / ${fmtDur(cramMins)}
        </span>
      </div>` : ''}
    </div>` : `<div class="hint" style="margin-top:10px">未设置 Normal / Cram 时间</div>`;

  return `
    <div class="task${overdue && !t.done ? ' overdue' : ''}${t.done ? ' done' : ''}" data-id="${t.id}">
      <div class="task-top">
        <input class="chk" type="checkbox" ${t.done ? 'checked' : ''}>
        <div class="task-main">
          <div class="task-title">${escapeHtml(t.title)}${t.subject ? `<span class="subject">${escapeHtml(t.subject)}</span>` : ''}</div>
          <div class="task-due">
            📅 ${fmtDue(t.due)} · <span class="cd ${cd.level}">${cd.text}</span>
          </div>
          ${notEnoughTime ? `<div class="warn">⚠️ 时间不够了：距截止只剩 ${fmtDur(minsLeft)}，Cram 还需 ${fmtDur(cLeft)}</div>` : ''}
        </div>
        <button class="del" data-act="del" title="删除">✕</button>
      </div>
      ${bars}
      <div class="task-actions">
        <button data-delta="15">+15m</button>
        <button data-delta="30">+30m</button>
        <button data-delta="60">+1h</button>
        <button data-delta="-15">-15m</button>
        <span class="spent">已投入 ${fmtDur(spent)}</span>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* =========================================================
   事件绑定
   ========================================================= */
// --- 设置面板 ---
$('#btnSettings').addEventListener('click', () => {
  $('#settingsPanel').classList.toggle('hidden');
  syncSettingsInputs();
});

function syncSettingsInputs() {
  $('#setLen').value = state.settings.cycleLength;
  $('#setAnchor').value = state.settings.anchorDate;
  $('#setSkip').checked = !!state.settings.skipWeekend;
}

$('#setLen').addEventListener('input', e => {
  const v = Math.max(1, Math.min(99, parseInt(e.target.value, 10) || 1));
  state.settings.cycleLength = v;
  save(); render();
});
$('#setAnchor').addEventListener('change', e => {
  if (e.target.value) { state.settings.anchorDate = e.target.value; save(); render(); }
});
$('#setSkip').addEventListener('change', e => {
  state.settings.skipWeekend = e.target.checked;
  save(); render();
});

// --- 添加任务 ---
$('#taskForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#fTitle').value.trim();
  if (!title) return;
  const due = $('#fDue').value;
  if (!due) return;

  state.tasks.push({
    id: uid(),
    title,
    subject: $('#fSubject').value.trim(),
    due,
    normalMins: parseDuration($('#fNormal').value),
    cramMins: parseDuration($('#fCram').value),
    spent: 0,
    done: false,
    createdAt: Date.now()
  });
  save();

  $('#fTitle').value = '';
  $('#fSubject').value = '';
  $('#fNormal').value = '';
  $('#fCram').value = '';
  $('#fTitle').focus();
  render();
});

// --- 任务列表交互（事件委托）---
const taskList = $('#taskList');

taskList.addEventListener('change', e => {
  if (!e.target.matches('input.chk')) return;
  const card = e.target.closest('.task');
  const t = state.tasks.find(x => x.id === card.dataset.id);
  if (!t) return;
  t.done = e.target.checked;
  save(); render();
});

taskList.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const card = btn.closest('.task');
  if (!card) return;
  const id = card.dataset.id;
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;

  if (btn.dataset.delta) {
    const d = Number(btn.dataset.delta);
    t.spent = Math.max(0, (t.spent || 0) + d);
    save(); render();
  } else if (btn.dataset.act === 'del') {
    if (!confirm('删除这个任务？')) return;
    state.tasks = state.tasks.filter(x => x.id !== id);
    save(); render();
  }
});

/* =========================================================
   初始化
   ========================================================= */
(function init() {
  // 默认 due = 明天 23:59
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(23, 59, 0, 0);
  $('#fDue').value = toLocalInput(d);

  syncSettingsInputs();
  render();

  // 每分钟刷新一次倒计时
  setInterval(render, 60000);
})();
</script>
</body>
</html>
